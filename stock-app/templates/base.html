<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}AI Stock Predictor{% endblock %}</title>

  <!-- Bootstrap 5 -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <!-- Bootstrap Icons -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    rel="stylesheet"
  />
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <!-- Custom CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>

<!-- ───────────────────────── Navbar ───────────────────────── -->
<nav class="navbar navbar-expand-lg sticky-top shadow-sm" id="mainNav">
  <div class="container-fluid px-4">
    <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" href="/">
      <i class="bi bi-graph-up-arrow text-primary fs-4"></i>
      <span>AI Stock Predictor</span>
    </a>

    <div class="d-flex align-items-center gap-3 ms-auto">
      <span class="badge bg-success d-none d-sm-inline" id="marketStatus">
        <i class="bi bi-circle-fill me-1" style="font-size:.5rem;"></i>Live
      </span>

      <!-- Dark / Light mode toggle -->
      <button
        class="btn btn-sm btn-outline-secondary rounded-pill px-3"
        id="themeToggle"
        title="Toggle dark / light mode"
      >
        <i class="bi bi-sun-fill" id="themeIcon"></i>
        <span id="themeLabel" class="ms-1 d-none d-sm-inline">Light</span>
      </button>
    </div>
  </div>
</nav>

<!-- ───────────────────────── Page Content ───────────────────────── -->
<main class="container-fluid px-3 px-md-4 py-4">
  {% block content %}{% endblock %}
</main>

<!-- ───────────────────────── Footer ───────────────────────── -->
<footer class="text-center py-3 small opacity-50 mt-4">
  AI Stock Predictor &mdash; for educational purposes only. Not financial advice.
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- Custom JS -->
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
